<!DOCTYPE html><html lang="en"><head>
<meta http-equiv="Cache-Control" content="max-age=3600"><meta http-equiv="refresh" content="0;url=https://social.acreetionos.org/"><meta name="description" content="Go to the AcreetionOS Mastodon instance." /><meta name="robots" content="noindex,follow" /><link rel="canonical" href="https://acreetionos.org/mastodon.html" /><title>Mastodon | AcreetionOS</title><link rel="stylesheet" href="contact.css"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:var(--acreetion-panel-bg,#181a1b);color:var(--acreetion-text,#e0e0e0);font-family:var(--font-sans,FreeSans,Arial,sans-serif);margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}a{color:var(--acreetion-green,#2ecc71);text-decoration:none}a:hover{text-decoration:underline}.redirect-box{background:var(--acreetion-box-bg,#23272a);border:1px solid var(--acreetion-box-border,#2ecc71);border-radius:12px;padding:2.5rem 2rem;box-shadow:0 2px 16px rgba(0,0,0,0.2);max-width:480px;text-align:center;margin:2rem}.redirect-title{color:var(--acreetion-green,#2ecc71);font-size:2rem;font-weight:700;margin-bottom:1rem}.redirect-msg{margin-bottom:1.5rem;font-size:1.1rem;line-height:1.5}.btn-container{display:flex;flex-direction:column;gap:1rem;margin-top:2rem}.btn{display:inline-block;padding:0.8rem 1.5rem;border-radius:12px;font-weight:bold;text-decoration:none!important;cursor:pointer;transition:all 0.2s}.btn-primary{background:var(--acreetion-green,#2ecc71);color:#111;border:1px solid var(--acreetion-green,#2ecc71)}.btn-primary:hover{background:#27ae60;border-color:#27ae60}.btn-secondary{background:transparent;border:1px solid var(--acreetion-green,#2ecc71);color:var(--acreetion-green,#2ecc71)}.btn-secondary:hover{background:rgba(46,204,113,0.1)}@media(max-width:600px){.redirect-box{padding:1.5rem 1rem}}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--acreetion-body-bg,#121212)}::-webkit-scrollbar-thumb{background:var(--acreetion-box-border,#333);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--acreetion-green,#2ecc71)}.btn{transition:all 0.3s ease}.btn:hover{box-shadow:0 0 15px rgba(46,204,113,0.4);transform:translateY(-2px)}.content-box{transition:transform 0.3s ease,box-shadow 0.3s ease}.content-box:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,0.5)}.reveal{opacity:0;transform:translateY(30px);transition:all 0.8s cubic-bezier(0.2,0.8,0.2,1);will-change:opacity,transform}.reveal.active{opacity:1;transform:translateY(0)}html{scroll-behavior:smooth}::selection{background:rgba(46,204,113,0.3);color:var(--acreetion-text-bright,#fff)}:focus-visible{outline:2px solid var(--acreetion-green,#2ecc71);outline-offset:3px;border-radius:4px}a:focus-visible,button:focus-visible{outline:2px solid var(--acreetion-green,#2ecc71);outline-offset:3px}/* removed pageLoadFade body animation *//* removed pageLoadFade keyframes */@media(prefers-reduced-motion:reduce){body{animation:none}html{scroll-behavior:auto}*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}</style></head><body>
<div class="redirect-box">
  <div class="redirect-title">Mastodon</div>
  <div class="redirect-msg">
    You are being redirected to our Mastodon instance at <strong>social.acreetionos.org</strong>.
  </div>
  <div class="redirect-msg" style="font-size:0.95rem;color:#aaa;">
    Redirecting in <span id="countdown">15</span> seconds...
  </div>
  <div class="btn-container">
    <a href="https://social.acreetionos.org/" class="btn btn-primary" id="go-btn">Go to Mastodon</a>
  </div>
</div>
<script>
window.location.replace("https://social.acreetionos.org/");
</script>
<button id="back-to-top" title="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'});">&#8593;</button>
<script>document.addEventListener('DOMContentLoaded',()=>{const btn=document.getElementById('back-to-top');if(!btn)return;window.addEventListener('scroll',()=>{if(window.scrollY>400){btn.classList.add('visible')}else{btn.classList.remove('visible')}})});</script>
</body></html>
